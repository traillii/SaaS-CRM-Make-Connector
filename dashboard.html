<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nordic CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-10">
        <header class="flex justify-between items-center mb-8 border-b pb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Dashboard</h1>
                <p class="text-slate-500 mt-1">Your Nordic CRM Portal</p>
            </div>
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 flex items-center gap-1">
                ← Back to Home
            </a>
        </header>
        <div id="loadingBox" class="py-20 text-center text-slate-500">
            Verifying your account...
        </div>
        <div id="mainBox" class="hidden">
            <div class="mb-6">
                <p class="text-slate-600">Welcome, <span id="userEmail" class="font-medium"></span></p>
            </div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">Your Clients</h2>
                <button id="openAddBtn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90">
                    + Add Client
                </button>
            </div>
            <div id="clientListBox" class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="p-10 text-center text-slate-400">
                    No clients yet, add your first client above.
                </div>
            </div>

            <!-- 新增/编辑共用弹窗 -->
            <div id="addModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-lg">
                    <h3 id="modalTitle" class="text-lg font-semibold mb-4">Add New Client</h3>
                    <form id="addForm">
                        <input type="hidden" id="editPageId" name="editPageId" value="">
                        <div class="mb-3">
                            <label class="block text-sm text-slate-600 mb-1">Client Name *</label>
                            <input required name="clientName" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200">
                        </div>
                        <div class="mb-3">
                            <label class="block text-sm text-slate-600 mb-1">Contact Email</label>
                            <input name="contactEmail" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200">
                        </div>
                        <div class="mb-3">
                            <label class="block text-sm text-slate-600 mb-1">Phone</label>
                            <input name="phone" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm text-slate-600 mb-1">Notes</label>
                            <textarea name="notes" rows="3" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200"></textarea>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="button" id="closeModalBtn" class="px-4 py-2 border rounded-lg">Cancel</button>
                            <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        const WORKER_B_URL = "https://us-xiaoyan.qq596337481.workers.dev";
        const loadingBox = document.getElementById("loadingBox");
        const mainBox = document.getElementById("mainBox");
        const userEmailEl = document.getElementById("userEmail");
        const clientListBox = document.getElementById("clientListBox");
        const addModal = document.getElementById("addModal");
        const openAddBtn = document.getElementById("openAddBtn");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const addForm = document.getElementById("addForm");
        const modalTitle = document.getElementById("modalTitle");
        const editPageIdInput = document.getElementById("editPageId");

        const params = new URLSearchParams(location.search);
        const uid = params.get("uid");
        if (!uid) {
            location.href = "/error.html";
        }

async function verifyUser() {
    try {
        const res = await fetch(WORKER_B_URL, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ uid })
        });
        const data = await res.json();
        if (!data.success) {
            location.href = "/error.html";
            return;
        }
        userEmailEl.innerText = data.email;
        const tipEl = document.createElement("div");
        tipEl.className = "mt-2 text-sm";
        tipEl.innerHTML = `<span class="text-blue-600">📦 当前套餐：${data.planName}（最多 ${data.maxClients} 客户）</span>`;
        userEmailEl.parentElement.appendChild(tipEl);

        loadingBox.classList.add("hidden");
        mainBox.classList.remove("hidden");
        loadClientList();
    } catch (err) {
        console.error(err);
        location.href = "/error.html";
    }
}


        async function loadClientList() {
            try {
                const res = await fetch(WORKER_B_URL, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ uid, action:"listClients" })
                });
                const data = await res.json();
                const list = data.list || [];
                if (!data.success || list.length === 0) {
                    clientListBox.innerHTML = `<div class="p-10 text-center text-slate-400">No clients yet, add your first client above.</div>`;
                    return;
                }
                let html = `<table class="w-full"><thead class="bg-slate-50"><tr class="text-left text-sm text-slate-500">
                    <th class="px-4 py-3">Name</th>
                    <th class="px-4 py-3">Email</th>
                    <th class="px-4 py-3">Phone</th>
                    <th class="px-4 py-3">Notes</th>
                    <th class="px-4 py-3">Created</th>
                    <th class="px-4 py-3">Operate</th>
                </tr></thead><tbody>`;
                list.forEach(item=>{
                    html += `<tr class="border-t">
                        <td class="px-4 py-3">${item.clientName}</td>
                        <td class="px-4 py-3">${item.contactEmail}</td>
                        <td class="px-4 py-3">${item.phone}</td>
                        <td class="px-4 py-3">${item.notes}</td>
                        <td class="px-4 py-3 text-sm">${item.createdTime || ""}</td>
                        <td class="px-4 py-3">
                            <button data-pageid="${item.pageId}" data-name="${item.clientName}" data-email="${item.contactEmail}" data-phone="${item.phone}" data-notes="${item.notes}" class="editBtn text-blue-600 hover:underline">Edit</button>
                        </td>
                    </tr>`;
                })
                html += "</tbody></table>";
                clientListBox.innerHTML = html;

                // 绑定编辑按钮事件
                document.querySelectorAll(".editBtn").forEach(btn=>{
                    btn.onclick = function(){
                        const pid = this.dataset.pageid;
                        addForm.reset();
                        editPageIdInput.value = pid;
                        modalTitle.innerText = "Edit Client";
                        addForm.clientName.value = this.dataset.name;
                        addForm.contactEmail.value = this.dataset.email;
                        addForm.phone.value = this.dataset.phone;
                        addForm.notes.value = this.dataset.notes;
                        addModal.classList.remove("hidden");
                    }
                })

            } catch (err) {
                console.error(err);
                clientListBox.innerHTML = `<div class="p-10 text-center text-red-400">Load client error</div>`;
            }
        }

        // 表单提交：新增 or 编辑
        addForm.addEventListener("submit", async (e)=>{
            e.preventDefault();
            const formData = new FormData(addForm);
            const editPageId = editPageIdInput.value.trim();
            const payload = {
                clientName: formData.get("clientName"),
                contactEmail: formData.get("contactEmail"),
                phone: formData.get("phone"),
                notes: formData.get("notes")
            };
            try {
                let res,data;
                if(editPageId){
                    // 编辑模式
                    payload.pageId = editPageId;
                    res = await fetch(WORKER_B_URL, {
                        method: "POST",
                        headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({ uid, action:"editClient", payload })
                    });
                    data = await res.json();
                }else{
                    // 新增模式
                    res = await fetch(WORKER_B_URL, {
                        method: "POST",
                        headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({ uid, action:"addClient", payload })
                    });
                    data = await res.json();
                }

                if (data.success) {
                    addModal.classList.add("hidden");
                    addForm.reset();
                    editPageIdInput.value = "";
                    modalTitle.innerText = "Add New Client";
                    loadClientList();
                } else {
                    alert(data.error || "Save failed");
                }
            } catch(err) {
                console.error(err);
                alert("Network error");
            }
        })

        // 打开新增弹窗
        openAddBtn.onclick = ()=>{
            addForm.reset();
            editPageIdInput.value = "";
            modalTitle.innerText = "Add New Client";
            addModal.classList.remove("hidden");
        };
        closeModalBtn.onclick = ()=> {
            addModal.classList.add("hidden");
            addForm.reset();
            editPageIdInput.value = "";
            modalTitle.innerText = "Add New Client";
        };

        verifyUser();
    </script>
</body>
</html>
