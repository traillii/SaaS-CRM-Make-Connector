<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
          colors: { neutral: {50:'#f7f7f7',100:'#eaeaea',800:'#222',900:'#111'} }
        }
      }
    }
  </script>
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-neutral-50 min-h-screen">
  <nav class="bg-white border-b border-neutral-100 px-6 py-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="font-medium text-neutral-900">SaaS Dashboard</div>
      <a href="/register.html" class="text-sm text-neutral-500 hover:text-neutral-900">Logout</a>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-6 py-10">
    <div id="loading">Loading your profile...</div>
    <div id="userPanel" class="hidden">
      <div class="bg-white rounded-xl p-8 shadow-sm border border-neutral-100 mb-6">
        <h2 class="text-xl font-medium text-neutral-900 mb-4">Account Info</h2>
        <div class="space-y-3 text-neutral-600">
          <p>Email: <span id="userEmail" class="text-neutral-900"></span></p>
          <p>User ID: <span id="userId"></span></p>
          <p>Status: <span id="userStatus"></span></p>
          <p>Trial ends: <span id="trialEnd"></span></p>
        </div>
      </div>
      <div class="bg-white rounded-xl p-8 shadow-sm border border-neutral-100">
        <h2 class="text-xl font-medium text-neutral-900 mb-4">Your Clients Quota</h2>
        <p class="text-neutral-500">Client limit & subscription area (Stripe对接后扩展)</p>
      </div>
    </div>
  </main>

  <script>
    const VERIFY_WORKER = "https://us-xiaoyan.qq596337481.workers.dev/";
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get("uid");
    if (!uid) {
      location.href="/error.html";
    }
    (async ()=>{
      try{
        const res = await fetch(`${VERIFY_WORKER}?uid=${uid}`);
        const data = await res.json();
        if(!data.ok){
          location.href="/error.html";
          return;
        }
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("userPanel").classList.remove("hidden");
        document.getElementById("userEmail").innerText = data.user.email;
        document.getElementById("userId").innerText = data.user.user_id;
        document.getElementById("userStatus").innerText = data.user.status;
        document.getElementById("trialEnd").innerText = data.user.trial_end;
      }catch(e){
        console.error(e);
        location.href="/error.html";
      }
    })()
  </script>
</body>
</html>
