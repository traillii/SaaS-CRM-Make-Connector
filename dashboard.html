<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#334155',
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-neutral text-primary min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-10">
        <!-- 顶部导航栏 -->
        <header class="flex justify-between items-center mb-10 border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-2xl font-semibold">Dashboard</h1>
                <p class="text-slate-500 mt-1">Customer Portal</p>
            </div>
            <a href="/" class="text-slate-600 hover:text-primary transition">← Back to Home</a>
        </header>

        <!-- 加载状态 -->
        <div id="loading" class="py-20 text-center">
            <p class="text-slate-500">Verifying your account...</p>
        </div>

        <!-- 主面板（默认隐藏） -->
        <div id="dashboardContent" class="hidden">
            <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
                <h2 class="text-xl font-medium mb-4">Welcome</h2>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm text-slate-500">Email</label>
                        <p id="userEmail" class="text-lg mt-1">-</p>
                    </div>
                    <div>
                        <label class="text-sm text-slate-500">User ID</label>
                        <p id="userId" class="text-lg mt-1">-</p>
                    </div>
                </div>
            </div>

            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="font-medium mb-2">Subscription</h3>
                    <p class="text-slate-500 text-sm">Plan status will show here after Stripe integration</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="font-medium mb-2">Settings</h3>
                    <p class="text-slate-500 text-sm">Update your contact information</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="font-medium mb-2">Support</h3>
                    <p class="text-slate-500 text-sm">Get help & documentation</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 👉 这里替换成你的 Worker B（查询用户信息）地址
        const WORKER_B = "us-xiaoyan.qq596337481.workers.dev";

        // 获取url上的uid参数
        function getUrlParam(name) {
            const params = new URLSearchParams(location.search);
            return params.get(name);
        }

        const uid = getUrlParam("uid");
        const loadingEl = document.getElementById("loading");
        const contentEl = document.getElementById("dashboardContent");

        if (!uid) {
            // 没有uid直接跳错误页
            location.href = "/error.html";
        }

        // 请求Worker B校验&读取用户信息
        fetch(WORKER_B, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ uid: uid })
        })
        .then(res => res.json())
        .then(data => {
            console.log("user data:", data);
            if (data.success) {
                // 填充用户信息
                document.getElementById("userEmail").innerText = data.email;
                document.getElementById("userId").innerText = data.uid;

                loadingEl.classList.add("hidden");
                contentEl.classList.remove("hidden");
            } else {
                location.href = "/error.html";
            }
        })
        .catch(err => {
            console.error("dashboard fetch error:", err);
            location.href = "/error.html";
        })
    </script>
</body>
</html>
