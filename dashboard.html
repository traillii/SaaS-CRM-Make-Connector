<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nordic CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-10">
        <header class="flex justify-between items-center mb-8 border-b pb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Dashboard</h1>
                <p class="text-slate-500 mt-1">Your Nordic CRM Portal</p>
            </div>
            <a href="/index.html" class="text-slate-500 hover:text-slate-800 flex items-center gap-1">
                ← Back to Home
            </a>        
        </header>
        <div id="loadingBox" class="py-20 text-center text-slate-500">
            Verifying your account...
        </div>
        <div id="mainBox" class="hidden">
            <div class="mb-6">
                <p class="text-slate-600">Welcome, <span id="userEmail" class="font-medium"></span></p>
            </div>
            <a id="accountLink" href="#" class="px-3 py-2 hover:text-gray-600">账户管理</a>
            <!-- ========= Tab导航 ========= -->
            <div class="flex border-b mb-6 mt-4">
                <button id="tabClient" class="px-4 py-2 border-b-2 border-blue-500 text-blue-600 font-medium">客户管理</button>
                <button id="tabProject" class="px-4 py-2 border-b-2 border-transparent text-gray-500 font-medium">项目管理</button>
                <button id="tabInvoice" class="px-4 py-2 border-b-2 border-transparent text-gray-500 font-medium">发票管理</button>
            </div>

            <!-- 客户面板 -->
            <div id="panelClient">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Your Clients</h2>
                    <div class="flex gap-2">
                        <button id="openAddBtn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-primary/90">
                            + Add Client
                        </button>
                        <button id="openBatchBtn" class="bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-600">
                            Batch Import
                        </button>
                    </div>
                </div>
                <div id="clientListBox" class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="p-10 text-center text-slate-400">
                        No clients yet, add your first client above.
                    </div>
                </div>
                <!-- 批量导入弹窗 -->
                <div id="batchModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                    <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-lg">
                        <h3 class="text-lg font-semibold mb-4">Batch Import Clients</h3>
                        <p class="text-sm text-slate-500 mb-2">格式：Name,Email,Phone,Notes，每行一条</p>
                        <textarea id="batchTextarea" rows="8" class="w-full border rounded-lg p-3"></textarea>
                        <div class="flex justify-end gap-2 mt-4">
                            <button id="closeBatchBtn" type="button" class="px-4 py-2 border rounded-lg">Cancel</button>
                            <button id="submitBatchBtn" class="px-4 py-2 bg-primary text-white rounded-lg">Import</button>
                        </div>
                    </div>
                </div>
                <!-- 新增/编辑共用弹窗 -->
                <div id="addModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                    <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-lg">
                        <h3 id="modalTitle" class="text-lg font-semibold mb-4">Add New Client</h3>
                        <form id="addForm">
                            <input type="hidden" id="editPageId" name="editPageId" value="">
                            <div class="mb-3">
                                <label class="block text-sm text-slate-600 mb-1">Client Name *</label>
                                <input required name="clientName" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200">
                            </div>
                            <div class="mb-3">
                                <label class="block text-sm text-slate-600 mb-1">Contact Email</label>
                                <input name="contactEmail" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200">
                            </div>
                            <div class="mb-3">
                                <label class="block text-sm text-slate-600 mb-1">Phone</label>
                                <input name="phone" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm text-slate-600 mb-1">Notes</label>
                                <textarea name="notes" rows="3" class="w-full border rounded-lg px-3 py-2 focus:outline-primary/50 border-slate-200"></textarea>
                            </div>
                            <div class="flex justify-end gap-2">
                                <button type="button" id="closeModalBtn" class="px-4 py-2 border rounded-lg">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 项目管理面板 -->
            <div id="panelProject" class="hidden">
                <div class="mb-4 flex justify-between items-center">
                    <h2 class="text-xl font-semibold">项目列表</h2>
                    <button id="btnAddProject" class="bg-blue-500 text-white px-4 py-2 rounded-lg">新增项目</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border p-2 text-left">项目名称</th>
                                <th class="border p-2 text-left">关联客户</th>
                                <th class="border p-2 text-left">计费方式</th>
                                <th class="border p-2 text-right">单价 €</th>
                                <th class="border p-2 text-right">总工时</th>
                                <th class="border p-2 text-right">项目税前金额 €</th>
                                <th class="border p-2 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="projectTableBody">
                            <tr><td colspan="7" class="p-4 text-center text-gray-400">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <!-- 新增项目弹窗 -->
                <div id="modalAddProject" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
                    <div class="bg-white p-6 rounded-lg w-full max-w-md">
                        <h3 class="text-lg font-semibold mb-4">新增项目</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-sm text-gray-600">项目名称 *</label>
                                <input type="text" id="inpProjectName" class="w-full border p-2 rounded" placeholder="填写项目名称">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600">关联客户</label>
                                <select id="selProjectClient" class="w-full border p-2 rounded">
                                    <option value="">-- 不关联客户 --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600">计费类型 *</label>
                                <select id="selBillingType" class="w-full border p-2 rounded">
                                    <option value="Hourly Rate">Hourly Rate（按时计费）</option>
                                    <option value="Retainer">Retainer（固定包月）</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600">单价(€) *</label>
                                <input type="number" step="0.01" id="inpRateAmount" class="w-full border p-2 rounded" placeholder="0.00">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600">总工时</label>
                                <input type="number" step="0.01" id="inpTotalHours" class="w-full border p-2 rounded" placeholder="0">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 mt-6">
                            <button id="closeProjectModal" class="px-4 py-2 border rounded">取消</button>
                            <button id="submitAddProject" class="px-4 py-2 bg-blue-500 text-white rounded">保存</button>
                        </div>
                    </div>
                </div>
                <!-- 编辑项目弹窗 -->
                <div id="editProjectModal" class="fixed inset-0 bg-black/50 hidden z-50">
                    <div class="bg-white p-6 rounded-lg w-full max-w-md">
                        <h3 class="text-lg font-semibold mb-4">编辑项目</h3>
                        <input type="hidden" id="editProjectId">
                        <div class="mb-3">
                          <label class="block text-sm mb-1">项目名称</label>
                          <input type="text" id="editProjectName" class="w-full border px-3 py-2 rounded">
                        </div>
                        <div class="mb-3">
                          <label class="block text-sm mb-1">关联客户</label>
                          <select id="editProjectClient" class="w-full border px-3 py-2 rounded">
                          </select>
                        </div>
                        <div class="mb-3">
                          <label class="block text-sm mb-1">计费方式</label>
                          <select id="editBillingType" class="w-full border px-3 py-2 rounded">
                            <option value="Hourly Rate">Hourly Rate</option>
                            <option value="Retainer">Retainer</option>
                          </select>
                        </div>
                        <div class="mb-3">
                          <label class="block text-sm mb-1">单价 €</label>
                          <input type="number" step="0.01" id="editRateAmount" class="w-full border px-3 py-2 rounded">
                        </div>
                        <div class="mb-3">
                          <label class="block text-sm mb-1">总工时</label>
                          <input type="number" step="0.01" id="editTotalHours" class="w-full border px-3 py-2 rounded">
                        </div>
                        <div class="flex gap-3 justify-end mt-4">
                          <button onclick="closeEditProject()" class="px-4 py-2 border rounded">取消</button>
                          <button onclick="saveEditProject()" class="px-4 py-2 bg-blue-500 text-white rounded">保存修改</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ✅发票面板：与客户、项目面板平级 -->
            <div id="panelInvoice" class="hidden mt-4">
                <iframe id="invoiceIframe" sandbox="allow-same-origin allow-scripts allow-forms"
                 style="width:100%; min-height:750px; border:0; overflow:visible;"></iframe>
            </div>

        </div>
    </div>
    <script>
        const WORKER_B_URL = "https://us-xiaoyan.qq596337481.workers.dev";
        const loadingBox = document.getElementById("loadingBox");
        const mainBox = document.getElementById("mainBox");
        const userEmailEl = document.getElementById("userEmail");
        const clientListBox = document.getElementById("clientListBox");
        const addModal = document.getElementById("addModal");
        const openAddBtn = document.getElementById("openAddBtn");
        const closeModalBtn = document.getElementById("closeModalBtn");
        const addForm = document.getElementById("addForm");
        const modalTitle = document.getElementById("modalTitle");
        const editPageIdInput = document.getElementById("editPageId");
        const params = new URLSearchParams(location.search);
        const uid = params.get("uid");
        const openBatchBtn = document.getElementById("openBatchBtn");
        const batchModal = document.getElementById("batchModal");
        const closeBatchBtn = document.getElementById("closeBatchBtn");
        const submitBatchBtn = document.getElementById("submitBatchBtn");
        const batchTextarea = document.getElementById("batchTextarea");

        let currentPlanKey = "";
        let invoiceIframeLoaded = false;

        if (!uid) {
            location.href = "/error.html";
        }
        document.getElementById("accountLink").href = `account.html?uid=${uid}`;

        async function verifyUser() {
            try {
                const res = await fetch(WORKER_B_URL, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ uid })
                });
                const data = await res.json();
                if (!data.success) {
                    location.href = "/error.html";
                    return;
                }
                currentPlanKey = data.planKey;
                if(currentPlanKey === "Trial"){
                    openBatchBtn.style.display = "none";
                }else{
                    openBatchBtn.style.display = "inline-block";
                }
                userEmailEl.innerText = data.email;
                const tipEl = document.createElement("div");
                tipEl.className = "mt-2 text-sm";
                tipEl.innerHTML = `<span class="text-blue-600">📦 当前套餐：${data.planName}（最多 ${data.maxClients} 客户）</span>`;
                userEmailEl.parentElement.appendChild(tipEl);
                loadingBox.classList.add("hidden");
                mainBox.classList.remove("hidden");
                loadClientList();
            } catch (err) {
                console.error(err);
                location.href = "/error.html";
            }
        }

        async function loadClientList() {
            try {
                const res = await fetch(WORKER_B_URL, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ uid, action:"listClients" })
                });
                const data = await res.json();
                const list = data.list || [];
                if (!data.success || list.length === 0) {
                    clientListBox.innerHTML = `<div class="p-10 text-center text-slate-400">No clients yet, add your first client above.</div>`;
                    return;
                }
                let html = `<table class="w-full"><thead class="bg-slate-50"><tr class="text-left text-sm text-slate-500">
                    <th class="px-4 py-3">Name</th>
                    <th class="px-4 py-3">Email</th>
                    <th class="px-4 py-3">Phone</th>
                    <th class="px-4 py-3">Notes</th>
                    <th class="px-4 py-3">Created</th>
                    <th class="px-4 py-3">Operate</th>
                </tr></thead><tbody>`;
                const isTrial = currentPlanKey === "Trial";
                list.forEach(item=>{
                    html += `<tr class="border-t">
                        <td class="px-4 py-3">${item.clientName}</td>
                        <td class="px-4 py-3">${item.contactEmail}</td>
                        <td class="px-4 py-3">${item.phone}</td>
                        <td class="px-4 py-3">${item.notes}</td>
                        <td class="px-4 py-3 text-sm">${item.createdTime || ""}</td>
                        <td class="px-4 py-3">
                            <button data-pageid="${item.pageId}" data-name="${item.clientName}" data-email="${item.contactEmail}" data-phone="${item.phone}" data-notes="${item.notes}" class="editBtn text-blue-600 hover:underline mr-3">Edit</button>
                            ${!isTrial ? `<button data-pageid="${item.pageId}" class="delBtn text-red-600 hover:underline">Delete</button>` : ""}
                        </td>
                    </tr>`;
                })
                html += "</tbody></table>";
                clientListBox.innerHTML = html;
                document.querySelectorAll(".editBtn").forEach(btn=>{
                    btn.onclick = function(){
                        const pid = this.dataset.pageid;
                        addForm.reset();
                        editPageIdInput.value = pid;
                        modalTitle.innerText = "Edit Client";
                        addForm.clientName.value = this.dataset.name;
                        addForm.contactEmail.value = this.dataset.email;
                        addForm.phone.value = this.dataset.phone;
                        addForm.notes.value = this.dataset.notes;
                        addModal.classList.remove("hidden");
                    }
                });
                document.querySelectorAll(".delBtn").forEach(btn=>{
                    btn.onclick = function(){
                        const pageId = this.dataset.pageid;
                        delClient(pageId);
                    }
                });
            } catch (err) {
                console.error(err);
                clientListBox.innerHTML = `<div class="p-10 text-center text-red-400">Load client error</div>`;
            }
        }

        async function delClient(pageId) {
            if (!confirm("Are you sure you want to delete this client?")) return;
            try {
                const res = await fetch(WORKER_B_URL, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({
                        uid,
                        action: "deleteClient",
                        payload: { pageId }
                    })
                });
                const data = await res.json();
                if (!data.success) {
                    alert(data.error);
                    return;
                }
                alert("Deleted successfully");
                loadClientList();
            } catch(err) {
                console.error(err);
                alert("Delete request failed");
            }
        }

        addForm.addEventListener("submit", async (e)=>{
            e.preventDefault();
            const formData = new FormData(addForm);
            const editPageId = editPageIdInput.value.trim();
            const payload = {
                clientName: formData.get("clientName"),
                contactEmail: formData.get("contactEmail"),
                phone: formData.get("phone"),
                notes: formData.get("notes")
            };
            try {
                let res,data;
                if(editPageId){
                    payload.pageId = editPageId;
                    res = await fetch(WORKER_B_URL, {
                        method: "POST",
                        headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({ uid, action:"editClient", payload })
                    });
                    data = await res.json();
                }else{
                    res = await fetch(WORKER_B_URL, {
                        method: "POST",
                        headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({ uid, action:"addClient", payload })
                    });
                    data = await res.json();
                }
                if (data.success) {
                    addModal.classList.add("hidden");
                    addForm.reset();
                    editPageIdInput.value = "";
                    modalTitle.innerText = "Add New Client";
                    loadClientList();
                } else {
                    alert(data.error || "Save failed");
                }
            } catch(err) {
                console.error(err);
                alert("Network error");
            }
        })

        openAddBtn.onclick = ()=>{
            addForm.reset();
            editPageIdInput.value = "";
            modalTitle.innerText = "Add New Client";
            addModal.classList.remove("hidden");
        };
        closeModalBtn.onclick = ()=> {
            addModal.classList.add("hidden");
            addForm.reset();
            editPageIdInput.value = "";
            modalTitle.innerText = "Add New Client";
        };

        verifyUser();

        openBatchBtn.onclick = ()=>{
            batchTextarea.value = "";
            batchModal.classList.remove("hidden");
        };
        closeBatchBtn.onclick = ()=>{
            batchModal.classList.add("hidden");
        };
        
        submitBatchBtn.onclick = async ()=>{
            const raw = batchTextarea.value.trim();
            if(!raw){
                alert("请粘贴导入数据");
                return;
            }
            const lines = raw.split("\n").map(l=>l.trim()).filter(l=>!!l);
            try{
                const res = await fetch(WORKER_B_URL,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        uid,
                        action:"batchAddClient",
                        payload:{ lines }
                    })
                });
                const data = await res.json();
                if(!data.success){
                    alert(data.error);
                    return;
                }
                alert(data.message);
                batchModal.classList.add("hidden");
                loadClientList();
            }catch(e){
                console.error(e);
                alert("批量导入请求失败");
            }
        };

       // ====================== 【项目模块JS开始】 ======================
const tabClient = document.getElementById("tabClient");
const tabProject = document.getElementById("tabProject");
const panelClient = document.getElementById("panelClient");
const panelProject = document.getElementById("panelProject");
let projectClientList = [];

const tabInvoice = document.getElementById("tabInvoice");
const panelInvoice = document.getElementById("panelInvoice");
const invoiceIframe = document.getElementById("invoiceIframe");

tabClient.onclick = () => {
    tabClient.classList.add("border-b-2", "border-blue-500", "text-blue-600");
    tabClient.classList.remove("border-transparent", "text-gray-500");
    tabProject.classList.remove("border-b-2", "border-blue-500", "text-blue-600");
    tabProject.classList.add("border-transparent", "text-gray-500");
    tabInvoice.classList.remove("border-b-2", "border-blue-500", "text-blue-600");
    tabInvoice.classList.add("border-transparent", "text-gray-500");
    panelClient.classList.remove("hidden");
    panelProject.classList.add("hidden");
    panelInvoice.classList.add("hidden");
};

tabProject.onclick = async () => {
    tabProject.classList.add("border-b-2", "border-blue-500", "text-blue-600");
    tabProject.classList.remove("border-transparent", "text-gray-500");
    tabClient.classList.remove("border-b-2", "border-blue-500", "text-blue-600");
    tabClient.classList.add("border-transparent", "text-gray-500");
    tabInvoice.classList.remove("border-b-2", "border-blue-500", "text-blue-600");
    tabInvoice.classList.add("border-transparent", "text-gray-500");
    panelClient.classList.add("hidden");
    panelProject.classList.remove("hidden");
    panelInvoice.classList.add("hidden");
    await loadProjectClientOptions();
    loadProjects();
};

tabInvoice.onclick = ()=>{
    tabInvoice.classList.add("border-b-2", "border-blue-500", "text-blue-600");
    tabInvoice.classList.remove("border-transparent", "text-gray-500");
    tabClient.classList.remove("border-b-2", "border-blue-500", "text-blue-600");
    tabClient.classList.add("border-transparent", "text-gray-500");
    tabProject.classList.remove("border-b-2", "border-blue-500", "text-blue-600");
    tabProject.classList.add("border-transparent", "text-gray-500");

    panelClient.classList.add("hidden");
    panelProject.classList.add("hidden");
    panelInvoice.classList.remove("hidden");
    if(!invoiceIframeLoaded){
        invoiceIframe.src = `/invoices.html?uid=${uid}`;
        invoiceIframeLoaded = true;
    }
}

async function loadProjectClientOptions(){
    const res = await fetch(WORKER_B_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ uid, action:"listClients" })
    })
    const json = await res.json();
    const sel = document.getElementById("selProjectClient");
    sel.innerHTML = `<option value="">-- 不关联客户 --</option>`;
    if(json.success){
        projectClientList = json.list;
        json.list.forEach(c=>{
            const opt = document.createElement("option");
            opt.value = c.pageId;
            opt.innerText = c.clientName;
            sel.appendChild(opt);
        })
    }
}

function fillEditClientSelect(){
    const sel = document.getElementById("editProjectClient");
    sel.innerHTML = "";
    projectClientList.forEach(c=>{
        const opt = document.createElement("option");
        opt.value = c.pageId;
        opt.innerText = c.clientName;
        sel.appendChild(opt);
    })
}

async function loadProjects(){
    const tbody = document.getElementById("projectTableBody");
    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">加载中...</td></tr>`;
    const res = await fetch(WORKER_B_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action:"getProjects", uid})
    })
    const json = await res.json();
    if(!json.success){
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-500">${json.error||json.msg}</td></tr>`;
        return;
    }
    const projects = json.projects;
    if(projects.length === 0){
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">暂无项目，点击新增</td></tr>`;
        return;
    }
    tbody.innerHTML = "";
    projects.forEach(p=>{
        const findClient = projectClientList.find(c=>c.pageId === p.clientPageId);
        const clientName = findClient ? findClient.clientName : "-";
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="border p-2">${p.projectName}</td>
            <td class="border p-2">${clientName}</td>
            <td class="border p-2">${p.billingType}</td>
            <td class="border p-2 text-right">${p.rateAmount}</td>
            <td class="border p-2 text-right">${p.totalHours}</td>
            <td class="border p-2 text-right">${p.projectValue}</td>
            <td class="border p-2 text-center">
                <a class="text-blue-500 cursor-pointer mr-3" onclick="openEditProject('${p.id}','${p.projectName}','${p.clientPageId}','${p.billingType}',${p.rateAmount},${p.totalHours})">编辑</a>
                <a class="text-red-500 cursor-pointer" onclick="delProject('${p.id}')">删除</a>
            </td>
        `;
        tbody.appendChild(tr);
    })
}

async function delProject(projectId){
    if(!confirm("确定删除这个项目？")) return;
    const delRes = await fetch(WORKER_B_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action:"deleteProject", uid, projectId: projectId})
    })
    const delJson = await delRes.json();
    alert(delJson.error||delJson.msg);
    loadProjects();
}

const modalAddProject = document.getElementById("modalAddProject");
document.getElementById("btnAddProject").onclick = ()=>{
    modalAddProject.classList.remove("hidden");
    modalAddProject.classList.add("flex");
}
document.getElementById("closeProjectModal").onclick = ()=>{
    modalAddProject.classList.add("hidden");
    modalAddProject.classList.remove("flex");
}
document.getElementById("submitAddProject").onclick = async ()=>{
    const projectName = document.getElementById("inpProjectName").value.trim();
    const clientPageId = document.getElementById("selProjectClient").value;
    const billingType = document.getElementById("selBillingType").value;
    const rateAmount = Number(document.getElementById("inpRateAmount").value);
    const totalHours = Number(document.getElementById("inpTotalHours").value);
    if(!projectName){
        alert("请填写项目名称");
        return;
    }
    const payload = {
        action:"addProject",
        uid,
        projectName,
        clientPageId,
        billingType,
        rateAmount,
        totalHours
    }
    const res = await fetch(WORKER_B_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    })
    const json = await res.json();
    alert(json.error||json.msg);
    if(json.success){
        modalAddProject.classList.add("hidden");
        modalAddProject.classList.remove("flex");
        loadProjects();
    }
};

function openEditProject(pid, pname, cid, bill, rate, hours) {
    fillEditClientSelect();
    document.getElementById('editProjectId').value = pid;
    document.getElementById('editProjectName').value = pname;
    document.getElementById('editProjectClient').value = cid;
    document.getElementById('editBillingType').value = bill;
    document.getElementById('editRateAmount').value = rate;
    document.getElementById('editTotalHours').value = hours;
    document.getElementById('editProjectModal').classList.remove('hidden');
    document.getElementById('editProjectModal').classList.add('flex');
}
function closeEditProject() {
    document.getElementById('editProjectModal').classList.add('hidden');
    document.getElementById('editProjectModal').classList.remove('flex');
}

async function saveEditProject() {
    const pid = document.getElementById('editProjectId').value;
    const pname = document.getElementById('editProjectName').value.trim();
    const cid = document.getElementById('editProjectClient').value;
    const bill = document.getElementById('editBillingType').value;
    const rate = document.getElementById('editRateAmount').value;
    const hours = document.getElementById('editTotalHours').value;
    const res = await fetch(WORKER_B_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            action:"editProject",
            uid: uid,
            projectId: pid,
            projectName: pname,
            clientPageId: cid,
            billingType: bill,
            rateAmount: rate,
            totalHours: hours
        })
    });
    const json = await res.json();
    if(json.success){
        alert(json.msg);
        closeEditProject();
        loadProjects();
    }else{
        alert(json.error);
    }
}
