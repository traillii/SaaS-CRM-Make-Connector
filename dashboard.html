<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#334155',
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .tab-active {
                @apply bg-primary text-white;
            }
        }
    </style>
</head>
<body class="bg-neutral text-primary min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- 顶部导航栏 -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-2xl font-semibold">Dashboard</h1>
                <p class="text-slate-500 mt-1">Your Nordic CRM Portal</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-sm text-slate-600">
                    <span id="userEmailDisplay">-</span>
                </div>
                <a href="/" class="text-slate-600 hover:text-primary transition">← Back to Home</a>
            </div>
        </header>
        <!-- 加载状态 -->
        <div id="loading" class="py-32 text-center">
            <p class="text-slate-500">Verifying your account...</p>
        </div>
        <!-- 主面板（默认隐藏） -->
        <div id="dashboardContent" class="hidden">
            <!-- Tab 导航 -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button class="tab-btn tab-active px-4 py-2 rounded-lg border border-slate-200 transition" data-target="tab-clients">Clients</button>
                <button class="tab-btn px-4 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition" data-target="tab-projects">Projects</button>
                <button class="tab-btn px-4 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition" data-target="tab-invoices">Invoices</button>
                <button class="tab-btn px-4 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition" data-target="tab-expenses">Expenses & Assets</button>
                <button class="tab-btn px-4 py-2 rounded-lg border border-slate-200 hover:bg-slate-100 transition" data-target="tab-tax">Tax Ledger</button>
            </div>
            <!-- Tab 内容区 -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden p-6">
                <!-- ========= Clients Tab：表格+新增表单 ========= -->
                <div class="tab-content" id="tab-clients">
                    <div class="mb-6 border-b pb-4">
                        <h3 class="text-lg font-medium mb-4">Add New Client</h3>
                        <form id="addClientForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm text-slate-600 mb-1">Client Name *</label>
                                <input type="text" id="inp_clientName" class="w-full border rounded-lg px-3 py-2" placeholder="Client name">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-600 mb-1">Contact Email</label>
                                <input type="email" id="inp_contactEmail" class="w-full border rounded-lg px-3 py-2" placeholder="email@example.com">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-600 mb-1">Phone</label>
                                <input type="text" id="inp_phone" class="w-full border rounded-lg px-3 py-2" placeholder="Phone">
                            </div>
                            <div>
                                <label class="block text-sm text-slate-600 mb-1">Notes</label>
                                <input type="text" id="inp_notes" class="w-full border rounded-lg px-3 py-2" placeholder="Notes">
                            </div>
                            <div class="md:col-span-2">
                                <button type="submit" class="bg-primary text-white px-5 py-2 rounded-lg">Add Client</button>
                            </div>
                        </form>
                    </div>

                    <h3 class="text-lg font-medium mb-3">Your Client List</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-100">
                                <tr>
                                    <th class="text-left p-3">Client Name</th>
                                    <th class="text-left p-3">Contact Email</th>
                                    <th class="text-left p-3">Phone</th>
                                    <th class="text-left p-3">Notes</th>
                                </tr>
                            </thead>
                            <tbody id="clientTableBody">
                                <tr><td colspan="4" class="p-4 text-slate-400">Loading your clients...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-content hidden" id="tab-projects">
                    <iframe class="w-full h-[75vh]" src="NOTION_EMBED_PROJECTS" frameborder="0"></iframe>
                </div>
                <div class="tab-content hidden" id="tab-invoices">
                    <iframe class="w-full h-[75vh]" src="NOTION_EMBED_INVOICES" frameborder="0"></iframe>
                </div>
                <div class="tab-content hidden" id="tab-expenses">
                    <iframe class="w-full h-[75vh]" src="NOTION_EMBED_EXPENSES" frameborder="0"></iframe>
                </div>
                <div class="tab-content hidden" id="tab-tax">
                    <iframe class="w-full h-[75vh]" src="NOTION_EMBED_TAX" frameborder="0"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script>
             // 👉 Worker B地址
        const WORKER_B = "https://us-xiaoyan.qq596337481.workers.dev";
        let currentUid = null;

        function getUrlParam(name) {
            const params = new URLSearchParams(location.search);
            return params.get(name);
        }
        const uid = getUrlParam("uid");
        const loadingEl = document.getElementById("loading");
        const contentEl = document.getElementById("dashboardContent");
        const clientTableBody = document.getElementById("clientTableBody");
        const addClientForm = document.getElementById("addClientForm");

        if (!uid) {
            location.href = "/error.html";
        }
        currentUid = uid;

        // 校验账号
        fetch(WORKER_B, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ uid: uid })
        })
        .then(res => res.json())
        .then(data => {
            console.log("user data:", data);
            if (data.success) {
                document.getElementById("userEmailDisplay").innerText = data.email;
                loadingEl.classList.add("hidden");
                contentEl.classList.remove("hidden");
                // 校验成功，加载自己的客户列表
                loadClientList();
            } else {
                location.href = "/error.html";
            }
        })
        .catch(err => {
            console.error("dashboard fetch error:", err);
            // 【修改这里】账号校验失败才跳转；loadClientList的错误不会走这里
            location.href = "/error.html";
        })

        // 加载当前用户的客户列表
        async function loadClientList(){
            try{
                const res = await fetch(WORKER_B,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({uid:currentUid, action:"listClients"})
                })
                const ret = await res.json();
                console.log("loadClients返回：", ret);
                if(!ret.success){
                    clientTableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-red-500">Load error: ${JSON.stringify(ret)}</td></tr>`;
                    return;
                }
                const list = ret.list;
                if(list.length ===0){
                    clientTableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-slate-400">No clients yet, add your first client above.</td></tr>`;
                    return;
                }
                let html = "";
                list.forEach(item=>{
                    html += `<tr class="border-b">
                        <td class="p-3">${escapeHtml(item.clientName)}</td>
                        <td class="p-3">${escapeHtml(item.contactEmail)}</td>
                        <td class="p-3">${escapeHtml(item.phone)}</td>
                        <td class="p-3">${escapeHtml(item.notes)}</td>
                    </tr>`
                })
                clientTableBody.innerHTML = html;
            }catch(err){
                console.error("loadClientList异常", err);
                clientTableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-red-500">请求客户列表失败：${err.message}</td></tr>`;
                // ⭐重点：这里不再跳转error，停留在页面展示错误！
            }
        }

        // 新增客户表单提交
        addClientForm.addEventListener("submit",async function(e){
            e.preventDefault();
            try{
                const payload = {
                    clientName: document.getElementById("inp_clientName").value.trim(),
                    contactEmail: document.getElementById("inp_contactEmail").value.trim(),
                    phone: document.getElementById("inp_phone").value.trim(),
                    notes: document.getElementById("inp_notes").value.trim()
                }
                const res = await fetch(WORKER_B,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        uid:currentUid,
                        action:"addClient",
                        payload:payload
                    })
                })
                const ret = await res.json();
                if(ret.success){
                    addClientForm.reset();
                    loadClientList();
                }else{
                    alert("Add failed: "+JSON.stringify(ret));
                }
            }catch(err){
                console.error("add client catch",err);
                alert("新增客户异常："+err.message);
            }
        })

        function escapeHtml(str){
            if(!str) return "";
            return str.replace(/[&<>"']/g, function(m){
                return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];
            })
        }

        // Tab切换逻辑
        const tabBtns = document.querySelectorAll(".tab-btn");
        const tabContents = document.querySelectorAll(".tab-content");
        tabBtns.forEach(btn=>{
            btn.onclick = () => {
                const targetId = btn.getAttribute("data-target");
                tabBtns.forEach(b=>b.classList.remove("tab-active"));
                tabContents.forEach(c=>c.classList.add("hidden"));
                btn.classList.add("tab-active");
                document.getElementById(targetId).classList.remove("hidden");
            }
        })

    </script>
</body>
</html>
