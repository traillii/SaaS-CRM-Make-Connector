<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            neutral: {
              50: '#f8f8f8',
              100: '#f1f1f1',
              200: '#e5e5e5',
              800: '#262626',
              900: '#171717',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-sm border border-neutral-200 p-8">
      <div class="mb-8">
        <h1 class="text-2xl font-semibold text-neutral-900">Create your account</h1>
        <p class="text-neutral-500 mt-2">Start your 30-day free trial</p>
      </div>

      <form id="registerForm">
        <div class="mb-5">
          <label class="block text-sm font-medium text-neutral-800 mb-2">Email</label>
          <input 
            type="email" 
            id="email" 
            required
            class="w-full border border-neutral-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-neutral-800 focus:border-transparent transition"
            placeholder="you@example.com"
          >
        </div>

        <button 
          type="submit" 
          id="submitBtn"
          class="w-full bg-neutral-900 text-white py-3 rounded-lg font-medium hover:bg-neutral-800 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Register
        </button>
      </form>

      <p id="msgBox" class="mt-4 text-sm text-center hidden"></p>
    </div>
  </div>

  <script>
    // ============ 这里替换成你的 Cloudflare Worker 地址 ============
    const WORKER_URL = "us-xiaoyan.qq596337481.workers.dev";
    // ==============================================================

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const msgBox = document.getElementById('msgBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";
      msgBox.classList.add('hidden');

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email: email })
        });

        const data = await res.json();

        if (data.status === "success") {
          // ✅ 重点：和 Make 返回键名保持一致 User_ID（大写U）
          location.href = `/dashboard.html?uid=${data.User_ID}`;
        } else {
          location.href = "/error.html";
        }
      } catch (err) {
        msgBox.classList.remove('hidden');
        msgBox.textContent = "Request failed, please try again.";
        msgBox.classList.add('text-red-600');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Register";
      }
    })
  </script>
</body>
</html>
