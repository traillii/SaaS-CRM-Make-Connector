<!DOCTYPE html>
<html>
<body>
<form id="registerForm">
  <input type="text" id="nameInput" placeholder="name">
  <input type="email" id="emailInput" placeholder="email">
  <button type="submit">提交</button>
</form>

<script>
const WORKER_URL = "https://morning-lab-3b2d.qq596337481.workers.dev";
const form = document.getElementById("registerForm");

form.addEventListener("submit", async function(e){
  e.preventDefault();
  console.log("✅ submit事件执行了！");
  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();
  console.log("数据：", {name, email});

  try{
    const res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name,email})
    })
    const ret = await res.json();
    console.log("Worker返回：", ret);
    if(ret.success){
      alert("成功！uid="+ret.uid);
      // window.location.href = `/dashboard?uid=${ret.uid}`;
    }else{
      alert("失败："+JSON.stringify(ret));
      // window.location.href = "/error.html";
    }
  }catch(err){
    console.error("❌ fetch报错",err);
    alert("请求异常："+err.message);
  }
})
</script>
</body>
</html>
