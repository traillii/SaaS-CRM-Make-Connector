<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            neutral: {
              50: '#f7f7f7',
              100: '#eaeaea',
              800: '#222222',
              900: '#111111',
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .input-focus {
        @apply ring-1 ring-neutral-900/20 focus:ring-neutral-900 focus:outline-none;
      }
    }
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl p-8 shadow-sm border border-neutral-100">
      <div class="mb-8">
        <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-medium text-neutral-900 mb-2">Get Started</h1>
        <p class="text-neutral-500">Enter your email to create your account.</p>
      </div>

      <form id="registerForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-2">Email address</label>
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-3 rounded-lg border border-neutral-200 input-focus transition-all"
            placeholder="you@example.com"
          >
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3 rounded-lg bg-neutral-900 text-white font-medium hover:bg-neutral-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btnText">Register</span>
        </button>
      </form>
<pre id="debugBox" class="hidden" style="white-space:pre-wrap; margin-top:16px; padding:12px; background:#f3f4f6; border-radius:8px; color:#333;"></pre>
<style>
.hidden {
  display: none;
}
</style>

      <p class="mt-6 text-xs text-neutral-400 text-center">
        By registering, you agree to our <a href="/privacy.html" class="underline hover:text-neutral-600">Privacy Policy</a>.
      </p>
    </div>
  </div>

<script>
const WORKER_URL = "https://us-xiaoyan.qq596337481.workers.dev";

const form = document.getElementById('registerForm');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    console.log("👉 开始请求 Worker");
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email: email })
    });
    console.log("👉 fetch 返回状态码：", res.status);

    const rawText = await res.text();
    console.log("👉 Worker 返回原始文本：", rawText);

    let data;
    try {
      data = JSON.parse(rawText);
      console.log("👉 解析后的data：", data);
    } catch(parseErr){
      console.log("❌ JSON解析失败，返回不是JSON：", rawText);
      return;
    }

    if (data.status === "success") {
      if(data.User_ID){
        console.log("✅ 跳转，uid=", data.User_ID);
        location.href = `/dashboard.html?uid=${data.User_ID}`
      }else{
        console.log("❌ data.User_ID 为空");
      }
    } else {
      console.log("❌ status不是success，跳error");
      location.href = "/error.html";
    }
  } catch (err) {
    console.log("❌ fetch层面捕获异常：", err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Register";
  }
})
</script>

</body>
</html>
