<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            200: '#e5e7eb',
                            700: '#374151',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-focus:focus {
                outline: none;
                border-color: #9ca3af;
                box-shadow: 0 0 0 3px rgba(156,163,175,0.2);
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.4rem)] font-semibold text-neutral-900">Create your account</h1>
            <p class="text-neutral-500 mt-2">Start your 30-day free trial</p>
        </div>
        <form id="registerForm" class="space-y-5">
            <!-- Name 输入框 -->
            <div>
                <label class="block text-sm font-medium text-neutral-700 mb-2">Your Name</label>
                <input
                    type="text"
                    id="name"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-neutral-200 input-focus transition-all"
                    placeholder="Your name"
                >
            </div>
            <!-- Email 输入框 -->
            <div>
                <label class="block text-sm font-medium text-neutral-700 mb-2">Email address</label>
                <input
                    type="email"
                    id="email"
                    required
                    class="w-full px-4 py-3 rounded-lg border border-neutral-200 input-focus transition-all"
                    placeholder="you@example.com"
                >
            </div>
            <button
                type="submit"
                class="w-full py-3 bg-neutral-900 text-white rounded-lg hover:bg-neutral-800 transition-all font-medium"
            >
                Register
            </button>
        </form>
        <p class="text-center text-sm text-neutral-500 mt-6">
            Already have an account?
            <a href="login.html" class="text-neutral-900 underline">Log in</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        // ========= 这里替换成你的 Worker A 地址 =========
        const WORKER_A_URL = "https://morning-lab-3b2d.qq596337481.workers.dev";

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            try {
                const response = await fetch(WORKER_A_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, email })
                });
                const resData = await response.json();
                if (resData.success) {
                    // 注册成功，跳转dashboard，携带uid参数
                    window.location.href = `dashboard.html?uid=${resData.uid}`;
                } else {
                    window.location.href = "error.html";
                }
            } catch (err) {
                console.error(err);
                window.location.href = "error.html";
            }
        })
    </script>
</body>
</html>
