<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nord: {
                            100: '#ECEFF4',
                            200: '#D8DEE9',
                            300: '#4C566A',
                            400: '#2E3440',
                            500: '#3B4252',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-gradient-nord {
                background: linear-gradient(135deg, #2E3440 0%, #3B4252 100%);
            }
        }
    </style>
</head>
<body class="bg-nord-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="mb-8 text-center">
                <h1 class="text-[clamp(1.8rem,4vw,2.4rem)] font-semibold text-nord-400 mb-2">Get started</h1>
                <p class="text-nord-300">Start your 30-day free trial. No credit card required.</p>
            </div>
            <form id="signupForm" class="space-y-5">
                <div>
                    <label class="block text-sm text-nord-400 mb-1">Email address</label>
                    <input 
                        type="email" 
                        id="email" 
                        required
                        class="w-full border border-nord-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-nord-300 focus:border-transparent transition"
                        placeholder="you@example.com">
                </div>
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-nord-400 hover:bg-nord-500 text-white py-3 rounded-lg transition font-medium">
                    <span id="btnText">Register</span>
                    <span id="loadingText" class="hidden">Processing...</span>
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-nord-300">
                By registering you agree to our 
                <a href="privacy.html" class="underline hover:text-nord-400">Privacy Policy</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const btnText = document.getElementById('btnText');
        const loadingText = document.getElementById('loadingText');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            submitBtn.disabled = true;
            btnText.classList.add('hidden');
            loadingText.classList.remove('hidden');

            try {
                const res = await fetch("https://morning-lab-3b2d.qq596337481.workers.dev", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email })
                });
                const txt = await res.text();
                let data;
                try {
                    data = JSON.parse(txt);
                } catch {
                    data = { status: "error", message: txt };
                }

                if (res.ok && data.status !== "error") {
                    window.location.href = "success.html?email=" + encodeURIComponent(email);
                } else {
                    window.location.href = `error.html?msg=${encodeURIComponent(data.message || "Registration failed")}`;
                }
            } catch (err) {
                console.error(err);
                window.location.href = `error.html?msg=${encodeURIComponent("Proxy connection error")}`;
            } finally {
                submitBtn.disabled = false;
                btnText.classList.remove('hidden');
                loadingText.classList.add('hidden');
            }
        })
    </script>
</body>
</html>
