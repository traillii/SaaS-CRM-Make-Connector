<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
</head>
<body>
<form id="registerForm">
  <input type="text" id="nameInput" placeholder="name">
  <input type="email" id="emailInput" placeholder="email">
  <button type="submit">提交</button>
</form>
<script>
const WORKER_URL = "https://morning-lab-3b2d.qq596337481.workers.dev";
const form = document.getElementById("registerForm");

form.addEventListener("submit", async function(e){
  e.preventDefault();
  console.log("✅ submit事件执行了！");
  const name = document.getElementById("nameInput").value.trim();
  const email = document.getElementById("emailInput").value.trim();

  if(!name){
    alert("请填写姓名");
    return;
  }
  if(!email){
    alert("请填写邮箱");
    return;
  }

  console.log("数据：", {name, email});
  try{
    const res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name,email})
    })
    const ret = await res.json();
    console.log("Worker返回：", ret);

    if(ret.success){
      alert("注册成功！7秒后跳转到仪表盘");
      setTimeout(()=>{
        window.location.href = `/dashboard?uid=${ret.uid}`;
      },7000);
    }else{
      // 适配WorkerA error对象 {code,message}
      const errObj = ret.error;
      if(typeof errObj === "object" && errObj.code === "EMAIL_EXIST"){
        alert(errObj.message);
      }else{
        const errMsg = typeof errObj === "string" ? errObj : JSON.stringify(errObj);
        alert("失败：" + errMsg);
      }
    }
  }catch(err){
    console.error("❌ fetch报错",err);
    alert("请求异常："+err.message);
  }
})
</script>
</body>
</html>
