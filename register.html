<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            200: '#e5e7eb',
                            700: '#374151',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-focus:focus {
                outline: none;
                border-color: #9ca3af;
                box-shadow: 0 0 0 3px rgba(156,163,175,0.2);
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm p-8">
        <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-medium text-neutral-900 mb-2">Create account</h2>
        <p class="text-neutral-500 mb-8">Start your free trial</p>
        <form id="registerForm">
            <div class="mb-5">
                <label class="block text-sm text-neutral-700 mb-1.5">Name</label>
                <input type="text" id="nameInput" class="w-full border border-neutral-200 rounded-lg px-4 py-2.5 input-focus" placeholder="Your name" required>
            </div>
            <div class="mb-8">
                <label class="block text-sm text-neutral-700 mb-1.5">Email</label>
                <input type="email" id="emailInput" class="w-full border border-neutral-200 rounded-lg px-4 py-2.5 input-focus" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="w-full bg-neutral-900 text-white py-2.5 rounded-lg hover:bg-neutral-800 transition">Register</button>
        </form>
    </div>

    <script>
        // ========= 这里替换成你的Worker A地址 =========
        const WORKER_URL = "https://morning-lab-3b2d.qq596337481.workers.dev/";

        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // ✅ 关键！阻止浏览器原生表单跳转
            console.log("表单触发提交！");

            const name = document.getElementById('nameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            console.log("提交数据：", {name, email});

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({name, email})
                });
                const data = await res.json();
                console.log("后端返回：", data);
                if(data.success){
                    window.location.href = `/dashboard?uid=${data.uid}`;
                }else{
                    window.location.href = "/error.html";
                }
            } catch (err) {
                console.error("fetch异常：", err);
                window.location.href = "/error.html";
            }
        })
    </script>
</body>
</html>
