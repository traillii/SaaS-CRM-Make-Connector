<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            neutral: {
              50: '#f7f7f7',
              100: '#eaeaea',
              800: '#222222',
              900: '#111111',
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .input-focus {
        @apply ring-1 ring-neutral-900/20 focus:ring-neutral-900 focus:outline-none;
      }
    }
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl p-8 shadow-sm border border-neutral-100">
      <div class="mb-8">
        <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-medium text-neutral-900 mb-2">Get Started</h1>
        <p class="text-neutral-500">Enter your email to create your account.</p>
      </div>

      <form id="registerForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-2">Email address</label>
          <input
            type="email"
            id="email"
            required
            class="w-full px-4 py-3 rounded-lg border border-neutral-200 input-focus transition-all"
            placeholder="you@example.com"
          >
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full py-3 rounded-lg bg-neutral-900 text-white font-medium hover:bg-neutral-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btnText">Register</span>
        </button>
      </form>
<pre id="debugBox" class="hidden" style="white-space:pre-wrap; margin-top:16px; padding:12px; background:#f3f4f6; border-radius:8px; color:#333;"></pre>
<style>
.hidden {
  display: none;
}
</style>

      <p class="mt-6 text-xs text-neutral-400 text-center">
        By registering, you agree to our <a href="/privacy.html" class="underline hover:text-neutral-600">Privacy Policy</a>.
      </p>
    </div>
  </div>

  <script>
    // Worker地址，密钥写在Worker环境变量，前端不留密钥
    const WORKER_URL = "https://morning-lab-3b2d.qq596337481.workers.dev/";

    const form = document.getElementById("registerForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      btnText.textContent = "Submitting...";

    // 替换开始
        // 替换开始（从第100行开始替换）
        try {
            // 1. 【补齐的核心】向你的 Worker 发送真正的注册请求
            const res = await fetch(WORKER_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ 
                    email: email 
                })
            });

            // 2. 解析后端返回的 JSON 数据
            const data = await res.json();
            console.log("注册接口返回数据：", data);

            // 3. 执行严密的校验与跳转
            if (data && data.status === "success") {
                if (data.User_ID) {
                    // 顺应 Cloudflare Pages 去除 .html 的美化路由规则，直接跳转到 /dashboard
                    location.href = `/dashboard?uid=${data.User_ID}`;
                } else {
                    console.error("后端返回成功，但未包含 User_ID 字段！", data);
                    location.href = "/error.html";
                }
            } else {
                console.error("后端返回状态不是 success：", data);
                location.href = "/error.html";
            }

        } catch (err) {

        console.error("解析或跳转过程中发生严重错误:", err);
        // location.href = "/error.html"; // 🚨 临时注释
    } finally {
        if (typeof submitBtn !== "undefined") submitBtn.disabled = false;
        if (typeof btnText !== "undefined") btnText.textContent = "Register";
    }

}); // 对应最外层的事件监听结束

  </script>
</body>
</html>
