<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nord: {
                            100: '#ECEFF4',
                            200: '#D8DEE9',
                            300: '#4C566A',
                            400: '#2E3440',
                            500: '#3B4252',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-nord-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
        <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-7 h-7 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-semibold text-nord-400 mb-2">Registration successful</h1>
        <p class="text-nord-300 mb-6">
            Welcome! Your 30-day trial has started.
            <br><span id="showEmail"></span>
        </p>
        <a href="index.html" class="inline-block bg-nord-400 hover:bg-nord-500 text-white px-6 py-3 rounded-lg transition">Back</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        if(email) document.getElementById('showEmail').innerText = email;
    </script>
</body>
</html>
