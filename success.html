<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Nordic Freelancer CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded-lg shadow w-full max-w-md">
  <h2 class="text-xl font-bold mb-4">Create your free account</h2>
  <div class="mb-4">
    <label class="block mb-1">Email</label>
    <input id="email" type="email" class="w-full border p-2 rounded" placeholder="your@email.com">
  </div>
  <button onclick="register()" class="w-full bg-blue-600 text-white py-2 rounded">Register (Free 1 month trial)</button>
  <div id="msg" class="mt-4"></div>
  <p class="mt-3">Already have account? <a href="login.html" class="text-blue-600">Login</a></p>
</div>
<script>
const MAKE_BASE_URL = "https://hook.eu1.make.com/a3rj9y99srr354937oi39k27tstzsvry";
const MAKE_API_SECRET = "654321";

async function register(){
  const email = document.getElementById("email").value.trim();
  const res = await fetch(MAKE_BASE_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "X-API-Secret": MAKE_API_SECRET
    },
    body:JSON.stringify({email:email})
  })
  const data = await res.json();
  document.getElementById("msg").innerText = data.msg;
  if(data.ok){
    setTimeout(()=>location.href="login.html",1200);
  }
}
</script>
</body>
</html>
