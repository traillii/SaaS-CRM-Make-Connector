<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            50: '#f7f7f5',
                            100: '#ecece8',
                            800: '#292926',
                            900: '#181816',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-neutral-50 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-sm p-8">
            <div class="mb-8">
                <h2 class="text-2xl font-semibold text-neutral-900">登录</h2>
                <p class="text-neutral-500 mt-1">输入注册邮箱进入后台</p>
            </div>
            <form id="loginForm">
                <div class="mb-5">
                    <label class="block text-sm text-neutral-700 mb-2">邮箱</label>
                    <input type="email" id="email" required
                           class="w-full px-4 py-3 border border-neutral-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-neutral-800 focus:border-transparent"
                           placeholder="you@example.com">
                </div>
                <div id="errMsg" class="text-red-500 text-sm mb-4 hidden"></div>
                <button type="submit" id="submitBtn"
                        class="w-full py-3 bg-neutral-900 text-white rounded-lg hover:bg-neutral-800 transition">
                    登录
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-neutral-500">
                还没有账号？
                <a href="/" class="text-neutral-900 underline">去注册</a>
            </div>
        </div>
    </div>

    <script>
        // 改成你这个Worker B的地址
        const LOGIN_WORKER_URL = "https://xxx.xxx.workers.dev";

        const form = document.getElementById('loginForm');
        const errMsg = document.getElementById('errMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "登录中...";
            const email = document.getElementById('email').value.trim();

            try {
                const res = await fetch(LOGIN_WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                })
                const data = await res.json();
                if (!data.ok) {
                    errMsg.innerText = data.msg;
                    errMsg.classList.remove('hidden');
                    return;
                }
                location.href = `/dashboard?uid=${data.User_ID}`;
            } catch (err) {
                errMsg.innerText = "网络异常，请稍后重试";
                errMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "登录";
            }
        })
    </script>
</body>
</html>
