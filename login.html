<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nordic CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Login</h1>
        <p class="text-slate-500 mb-6">Enter your registered email to sign in</p>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-sm text-slate-600 mb-1">Email</label>
                <input required type="email" name="email" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-primary/50">
            </div>
            <div id="msgBox" class="mb-4 text-red-500 text-sm hidden"></div>
            <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-primary/90">Sign In</button>
        </form>
        <div class="mt-4 text-center">
            <a href="/index.html" class="text-primary hover:underline">← Back to Sign Up</a>
        </div>
    </div>

    <script>
        const WORKER_B_URL = "https://us-xiaoyan.qq596337481.workers.dev";
        const loginForm = document.getElementById("loginForm");
        const msgBox = document.getElementById("msgBox");

        function showMsg(text){
            msgBox.innerText = text;
            msgBox.classList.remove("hidden");
        }

        loginForm.addEventListener("submit",async (e)=>{
            e.preventDefault();
            msgBox.classList.add("hidden");
            const fd = new FormData(loginForm);
            const email = fd.get("email");
            try{
                const res = await fetch(WORKER_B_URL,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        action:"loginByEmail",
                        email: email
                    })
                });
                const data = await res.json();
                if(!data.success){
                    showMsg(data.error || "Login failed");
                    return;
                }
                // 登录成功跳转到dashboard
                location.href = `/dashboard.html?uid=${data.uid}`;
            }catch(err){
                console.error(err);
                showMsg("Network error");
            }
        })
    </script>
</body>
</html>
