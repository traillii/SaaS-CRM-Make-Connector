<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#334155',
                        neutral: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-neutral text-primary min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="mb-8 text-center">
            <a href="/" class="text-slate-500 hover:text-primary">← Back to Home</a>
            <h1 class="text-[clamp(1.8rem,4vw,2.4rem)] font-semibold mt-4">Sign in</h1>
            <p class="text-slate-500 mt-2">Enter your email to access your dashboard</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-8">
            <form id="loginForm">
                <div class="mb-6">
                    <label class="block text-sm text-slate-600 mb-2">Email address</label>
                    <input 
                        type="email" 
                        id="emailInput"
                        required
                        class="w-full border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:border-slate-300 transition"
                        placeholder="you@example.com"
                    >
                </div>

                <button 
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-primary text-white py-3 rounded-lg hover:bg-slate-700 transition"
                >
                    Continue
                </button>
            </form>

            <div id="msgBox" class="mt-4 text-center hidden"></div>
        </div>
        <p class="text-center text-slate-500 text-sm mt-6">
            Don’t have an account?
            <a href="/register.html" class="text-primary underline">Register</a>
        </p>
    </div>

    <script>
        // 👉 修改为你的【登录查询Worker地址】（接收email去查用户）
        const LOGIN_WORKER_URL = "https://denglu.qq596337481.workers.dev";

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("emailInput");
        const submitBtn = document.getElementById("submitBtn");
        const msgBox = document.getElementById("msgBox");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "Checking...";
            msgBox.classList.add("hidden");

            try {
                const res = await fetch(LOGIN_WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email })
                });
                const data = await res.json();
                if (data.success) {
                    // 查询成功，携带uid跳转到dashboard
                    location.href = `/dashboard?uid=${data.uid}`;
                } else {
                    msgBox.textContent = data.msg || "No account found with this email.";
                    msgBox.classList.remove("hidden");
                    msgBox.classList.add("text-red-500");
                }
            } catch (err) {
                msgBox.textContent = "Connection error, please try again later.";
                msgBox.classList.remove("hidden");
                msgBox.classList.add("text-red-500");
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Continue";
            }
        })
    </script>
</body>
</html>
