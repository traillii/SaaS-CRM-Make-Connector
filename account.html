<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户与订阅 | Nordic CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .skeleton {
            animation: pulse-soft 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: #e2e8f0;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部全局导航栏 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-sm">
                    N
                </div>
                <div>
                    <span class="font-semibold text-slate-900 tracking-tight">Nordic CRM</span>
                    <span class="hidden sm:inline-block text-slate-300 mx-2">|</span>
                    <span class="hidden sm:inline-block text-sm text-slate-500">账户与订阅中心</span>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <a href="#" id="backBtn" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    <span>返回工作台</span>
                </a>
                <a href="login.html" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm font-medium text-rose-600 bg-rose-50 border border-rose-100 rounded-lg hover:bg-rose-100 transition">
                    <span>退出登录</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-10">

        <!-- 页面标题区 -->
        <div class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">账户 & 订阅管理</h1>
                <p class="text-sm text-slate-500 mt-1">管理您的个人账号信息、查看客户配额以及随时升级订阅方案</p>
            </div>
            <!-- UID 快捷复制徽章 -->
            <button onclick="copyUid()" id="uidCopyBtn" class="self-start sm:self-auto inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs text-slate-600 hover:border-slate-300 hover:bg-slate-50 transition shadow-sm" title="点击复制账户 ID">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>ID: <strong id="displayUidText" class="font-mono text-slate-800">加载中...</strong></span>
                <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>
        </div>

        <!-- 全局错误提示条（默认隐藏） -->
        <div id="errorBanner" class="hidden mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="errorText">无法加载账户数据，请检查网络连接。</span>
            </div>
            <button onclick="initPage()" class="px-3 py-1 bg-white border border-rose-200 rounded-lg text-xs font-medium hover:bg-rose-100 transition">重试</button>
        </div>

        <!-- 1. 当前账户与订阅概览卡片 -->
        <section class="mb-10">
            <div id="userInfoBox" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <!-- 骨架屏占位 -->
                <div class="p-6 sm:p-8 space-y-4">
                    <div class="flex justify-between items-center">
                        <div class="skeleton h-6 w-32"></div>
                        <div class="skeleton h-6 w-20 rounded-full"></div>
                    </div>
                    <div class="skeleton h-10 w-56"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t border-slate-100">
                        <div class="skeleton h-16 w-full"></div>
                        <div class="skeleton h-16 w-full"></div>
                        <div class="skeleton h-16 w-full"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 套餐升级与对比列表 -->
        <section>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-5 gap-2">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">更换 / 升级订阅方案</h2>
                    <p class="text-sm text-slate-500 mt-0.5">所有付费套餐均支持通过 Stripe 安全结账，升级后客户上限立即生效</p>
                </div>
                <span class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full self-start sm:self-auto">
                    <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                    Stripe 加密支付保障
                </span>
            </div>

            <div id="planListBox" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 套餐骨架屏 -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200 space-y-4">
                    <div class="skeleton h-6 w-28"></div>
                    <div class="skeleton h-10 w-36"></div>
                    <div class="skeleton h-20 w-full"></div>
                    <div class="skeleton h-10 w-full rounded-xl"></div>
                </div>
                <div class="bg-white rounded-2xl p-6 border border-slate-200 space-y-4">
                    <div class="skeleton h-6 w-28"></div>
                    <div class="skeleton h-10 w-36"></div>
                    <div class="skeleton h-20 w-full"></div>
                    <div class="skeleton h-10 w-full rounded-xl"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部辅助提示 -->
    <footer class="max-w-5xl w-full mx-auto px-4 sm:px-6 py-8 border-t border-slate-200/80 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-400">
        <div>Nordic CRM & Tax Automation System · 专为北欧自由职业者与中小企业打造</div>
        <div>需要发票开具或企业定制配额？请联系客服并附上您的账户 ID</div>
    </footer>

    <script>
        const workerB = "https://us-xiaoyan.qq596337481.workers.dev/";
        const urlParams = new URLSearchParams(location.search);
        const uid = urlParams.get("uid") || localStorage.getItem("nordic_uid") || "";

        if (!uid) {
            location.href = "login.html";
        } else {
            localStorage.setItem("nordic_uid", uid);
            document.getElementById("backBtn").href = `dashboard?uid=${encodeURIComponent(uid)}`;
            document.getElementById("displayUidText").innerText = uid;
        }

        let userData = null;

        // 一键复制 UID
        function copyUid() {
            if (!uid) return;
            navigator.clipboard.writeText(uid).then(() => {
                const textEl = document.getElementById("displayUidText");
                const oldText = textEl.innerText;
                textEl.innerText = "已复制!";
                textEl.classList.add("text-emerald-600");
                setTimeout(() => {
                    textEl.innerText = oldText;
                    textEl.classList.remove("text-emerald-600");
                }, 1500);
            });
        }

        function showError(msg) {
            const banner = document.getElementById("errorBanner");
            document.getElementById("errorText").innerText = msg;
            banner.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("errorBanner").classList.add("hidden");
        }

        // 读取用户当前套餐信息
        async function loadUserInfo() {
            const res = await fetch(workerB, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ uid })
            });
            const json = await res.json();
            if (!json.success) {
                throw new Error(json.error || "账户验证失败或登录已过期");
            }
            userData = json;
            renderUserInfo(json);
        }

        function renderUserInfo(u) {
            const box = document.getElementById("userInfoBox");
            const isFree = (u.planKey || "").toLowerCase().includes("free") || Number(u.maxClients) <= 5;
            const statusText = isFree ? "基础免费版" : "订阅生效中";

            box.innerHTML = `
                <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 px-6 py-5 sm:px-8 sm:py-6 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-2.5">
                            <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">当前生效套餐</span>
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-white/10 text-emerald-300 border border-white/10">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                ${statusText}
                            </span>
                        </div>
                        <h3 class="text-2xl sm:text-3xl font-bold mt-1 tracking-tight">${u.planName || "标准版"}</h3>
                    </div>
                    <div class="text-left sm:text-right">
                        <div class="text-xs text-slate-400">绑定登录邮箱</div>
                        <div class="text-sm sm:text-base font-medium text-slate-100 mt-0.5">${u.email || "未绑定邮箱"}</div>
                    </div>
                </div>

                <div class="p-6 sm:px-8 sm:py-6 grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 bg-white">
                    <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="text-xs text-slate-500 font-medium">客户管理上限</div>
                        <div class="mt-1 flex items-baseline gap-1.5">
                            <span class="text-2xl font-bold text-slate-900">${u.maxClients ?? "-"}</span>
                            <span class="text-xs text-slate-500">个活跃客户档案</span>
                        </div>
                    </div>

                    <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="text-xs text-slate-500 font-medium">套餐标识符 (Plan Key)</div>
                        <div class="mt-1.5">
                            <span class="inline-block font-mono text-sm font-semibold text-slate-800 bg-white px-2.5 py-0.5 rounded border border-slate-200">
                                ${u.planKey || "default"}
                            </span>
                        </div>
                    </div>

                    <div class="p-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="text-xs text-slate-500 font-medium">已解锁核心功能</div>
                        <div class="mt-1.5 text-sm font-medium text-slate-800 flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            <span>Notion 同步 & AI 发票识别</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 加载所有套餐
        async function loadPlans() {
            const res = await fetch(workerB, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "listPlans", uid })
            });
            const json = await res.json();
            if (!json.success) {
                throw new Error(json.error || "无法获取套餐列表");
            }
            renderPlans(json.plans || []);
        }

        function formatBillingCycle(cycle) {
            if (!cycle) return "月";
            const c = cycle.toLowerCase();
            if (c.includes("month")) return "月";
            if (c.includes("year") || c.includes("annual")) return "年";
            return cycle;
        }

        function renderPlans(plans) {
            const box = document.getElementById("planListBox");
            box.innerHTML = "";

            if (plans.length === 0) {
                box.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 bg-white rounded-2xl border border-slate-200">暂无可切换的订阅套餐</div>`;
                return;
            }

            plans.forEach(p => {
                const stripeUrl = p.stripeSandboxId
                    ? `https://checkout.stripe.com/pay/${p.stripeSandboxId}?client_reference_id=${encodeURIComponent(uid)}`
                    : "#";
                const isCurrent = userData && p.planKey === userData.planKey;
                const priceNum = Number(p.priceEUR || 0);
                const cycleLabel = formatBillingCycle(p.billingCycle);

                const cardBorder = isCurrent
                    ? "border-slate-900 ring-2 ring-slate-900/10"
                    : "border-slate-200 hover:border-slate-300 hover:shadow-md";

                box.innerHTML += `
                    <div class="bg-white rounded-2xl p-6 sm:p-7 border ${cardBorder} transition-all flex flex-col justify-between relative">
                        ${isCurrent ? `
                            <div class="absolute -top-3 right-6 px-3 py-0.5 bg-slate-900 text-white text-xs font-semibold rounded-full shadow-sm">
                                当前使用中
                            </div>
                        ` : ""}

                        <div>
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-lg text-slate-900">${p.displayName}</h3>
                            </div>

                            <div class="mt-4 flex items-baseline gap-1">
                                <span class="text-3xl sm:text-4xl font-extrabold text-slate-900">€${priceNum}</span>
                                <span class="text-sm text-slate-500 font-medium">/ ${cycleLabel}</span>
                            </div>

                            <p class="text-xs text-slate-400 mt-1 mb-5">
                                ${priceNum === 0 ? "永久免费体验基础客户与记账功能" : "支持随时取消或变更订阅级别"}
                            </p>

                            <ul class="space-y-3 text-sm text-slate-600 mb-6">
                                <li class="flex items-center gap-2.5">
                                    <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                    </svg>
                                    <span>最多管理 <strong class="text-slate-900">${p.maxClients}</strong> 个客户档案</span>
                                </li>
                                <li class="flex items-center gap-2.5">
                                    <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                    </svg>
                                    <span>Notion 数据库实时双向同步</span>
                                </li>
                                <li class="flex items-center gap-2.5">
                                    <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                    </svg>
                                    <span>AI 发票识别与北欧增值税计算</span>
                                </li>
                            </ul>
                        </div>

                        <div>
                            ${isCurrent
                                ? `<button disabled class="w-full py-2.5 px-4 bg-slate-100 text-slate-500 font-medium text-sm rounded-xl cursor-not-allowed">
                                    当前已订阅此方案
                                   </button>`
                                : (p.stripeSandboxId
                                    ? `<a href="${stripeUrl}" target="_blank" onclick="handleUpgradeClick(this)" class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl transition shadow-sm">
                                        <span>立即升级至 ${p.displayName}</span>
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                        </svg>
                                       </a>`
                                    : `<button disabled class="w-full py-2.5 px-4 bg-slate-100 text-slate-400 font-medium text-sm rounded-xl cursor-not-allowed">
                                        暂未开放线上购买
                                       </button>`
                                )
                            }
                        </div>
                    </div>
                `;
            });
        }

        function handleUpgradeClick(el) {
            const span = el.querySelector("span");
            if (span) {
                const orig = span.innerText;
                span.innerText = "正在前往 Stripe 结账页...";
                setTimeout(() => { span.innerText = orig; }, 3000);
            }
        }

        async function initPage() {
            hideError();
            try {
                await loadUserInfo();
                await loadPlans();
            } catch (err) {
                showError(err.message || "加载账户与套餐信息失败，请稍后重试。");
            }
        }

        initPage();
    </script>
</body>
</html>
