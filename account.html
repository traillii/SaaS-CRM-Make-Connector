<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account & Plans | Nordic CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-10">
        <header class="flex justify-between items-center mb-8 border-b pb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Account & Subscription</h1>
                <p class="text-slate-500">Upgrade your plan</p>
            </div>
            <a id="backDash" href="/dashboard.html" class="text-slate-500 hover:text-slate-800">← Back Dashboard</a>
        </header>
        <div id="loadingBox" class="py-16 text-center text-slate-500">Loading...</div>
        <div id="mainBox" class="hidden">
            <div class="mb-8">
                <p class="text-lg">Email: <span id="userEmail" class="font-medium"></span></p>
                <p class="text-lg">Current Plan: <span id="currentPlan" class="font-medium text-primary"></span></p>
            </div>
            <h2 class="text-xl font-semibold mb-4">Available Plans</h2>
            <div id="planWrap" class="grid md:grid-cols-2 gap-4">
            </div>
        </div>
    </div>
    <script>
        const WORKER_B_URL = "https://us-xiaoyan.qq596337481.workers.dev";
        const loadingBox = document.getElementById("loadingBox");
        const mainBox = document.getElementById("mainBox");
        const userEmailEl = document.getElementById("userEmail");
        const currentPlanEl = document.getElementById("currentPlan");
        const planWrap = document.getElementById("planWrap");
        const backDash = document.getElementById("backDash");

        const params = new URLSearchParams(location.search);
        const uid = params.get("uid");
        if (!uid) location.href="/error.html";
        backDash.href = `/dashboard.html?uid=${uid}`;

        let userInfo;
        async function init(){
            // 校验用户
            const uRes = await fetch(WORKER_B_URL,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({uid})
            });
            userInfo = await uRes.json();
            if(!userInfo.success) location.href="/error.html";
            userEmailEl.innerText = userInfo.email;
            currentPlanEl.innerText = `${userInfo.planName} (Max ${userInfo.maxClients} clients)`;

            // 获取套餐列表
            const pRes = await fetch(WORKER_B_URL,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({uid, action:"listPlans"})
            });
            const pData = await pRes.json();
            if(!pData.success){
                alert("加载套餐失败");
                return;
            }
            const plans = pData.plans;
            let html = "";
            plans.forEach(plan=>{
                html += `
                <div class="bg-white rounded-xl shadow p-6 border ${plan.planKey === userInfo.planKey ? 'border-primary' : 'border-slate-100'}">
                    <h3 class="text-lg font-bold">${plan.displayName}</h3>
                    <p class="text-3xl font-bold mt-2">€${plan.priceEUR} <span class="text-sm text-slate-400">/${plan.billingCycle.toLowerCase()}</span></p>
                    <p class="mt-3 text-slate-600">Max clients: ${plan.maxClients === 9999 ? "Unlimited" : plan.maxClients}</p>
                    ${plan.planKey === userInfo.planKey ? `<div class="mt-4 text-primary font-medium">✅ Current Plan</div>` : `<button class="mt-4 w-full bg-primary text-white py-2 rounded-lg hover:bg-primary/90 upgradeBtn" data-plan="${plan.planKey}" data-stripe="${plan.stripeLiveId}">Upgrade</button>`}
                </div>`;
            })
            planWrap.innerHTML = html;
            loadingBox.classList.add("hidden");
            mainBox.classList.remove("hidden");

            // 升级按钮（后面对接Stripe checkout，现在只是占位）
            document.querySelectorAll(".upgradeBtn").forEach(btn=>{
                btn.onclick = function(){
                    const stripePriceId = this.dataset.stripe;
                    alert(`准备跳转Stripe结账，PriceID:${stripePriceId}`);
                }
            })
        }
        init();
    </script>
</body>
</html>
