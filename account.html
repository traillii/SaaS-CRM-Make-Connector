<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户与订阅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f7f7f5;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-semibold text-gray-800">账户 & 订阅</h1>
            <div class="space-x-3">
                <!-- <a href="dashboard.html?uid=<%=uid%>" class="px-4 py-2 bg-white border rounded-lg hover:bg-gray-100">返回面板</a> -->
                <a href="#" id="backBtn" class="px-4 py-2 rounded border">返回面板</a>
                <a href="login.html" class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700">退出登录</a>
            </div>
        </div>

        <!-- 当前套餐卡片 -->
        <div id="userInfoBox" class="bg-white rounded-xl p-6 shadow-sm mb-8">
            <div class="text-gray-400">加载中...</div>
        </div>

        <!-- 全部可购买套餐 -->
        <h2 class="text-xl font-medium mb-4">更换 / 升级套餐</h2>
        <div id="planListBox" class="grid md:grid-cols-2 gap-4">
            <div class="text-gray-400">加载套餐列表</div>
        </div>
    </div>

    <script>
        const workerB = "https://us-xiaoyan.qq596337481.workers.dev/";
        const urlParams = new URLSearchParams(location.search);
        const uid = urlParams.get("uid");
document.getElementById("backBtn").href = `dashboard?uid=${uid}`;
        if (!uid) {
            location.href = "login.html";
        }

        let userData = null;

        // 读取用户当前套餐信息（和dashboard校验接口一致）
        async function loadUserInfo() {
            try {
                const res = await fetch(workerB, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ uid })
                });
                const json = await res.json();
                if (!json.success) {
                    location.href = "error.html";
                    return;
                }
                userData = json;
                renderUserInfo(json);
            } catch(e) {
                location.href = "error.html";
            }
        }

        function renderUserInfo(u) {
            const box = document.getElementById("userInfoBox");
            box.innerHTML = `
                <div class="text-sm text-gray-500 mb-2">当前订阅</div>
                <div class="text-xl font-semibold mb-2">${u.planName}</div>
                <div class="text-gray-600 mb-1">邮箱：${u.email}</div>
                <div class="text-gray-600 mb-1">客户上限：${u.maxClients} 个</div>
                <div class="mt-3 text-sm text-gray-400">套餐标识：${u.planKey}</div>
            `;
        }

        // 加载所有套餐
        async function loadPlans() {
            const res = await fetch(workerB, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ action:"listPlans", uid })
            });
            const json = await res.json();
            if (!json.success) return;
            renderPlans(json.plans);
        }

        function renderPlans(plans) {
            const box = document.getElementById("planListBox");
            box.innerHTML = "";
            plans.forEach(p => {
                // 区分沙盒/正式，你后续Stripe测试先用sandboxId
                const stripeUrl = p.stripeSandboxId
                    ? `https://checkout.stripe.com/pay/${p.stripeSandboxId}?client_reference_id=${uid}`
                    : "#";
                const isCurrent = p.planKey === userData.planKey;
                box.innerHTML += `
                    <div class="bg-white rounded-xl p-6 shadow-sm border ${isCurrent ? 'border-gray-800' : 'border-gray-100'}">
                        <div class="font-semibold text-lg">${p.displayName}</div>
                        <div class="text-gray-500 my-2">${p.priceEUR} EUR / ${p.billingCycle}</div>
                        <div class="text-sm text-gray-400 mb-4">最多 ${p.maxClients} 客户</div>
                        ${isCurrent
                            ? `<span class="inline-block px-3 py-1 bg-gray-100 rounded text-sm">当前套餐</span>`
                            : `<a href="${stripeUrl}" target="_blank" class="inline-block px-4 py-2 bg-gray-800 text-white rounded-lg">升级</a>`
                        }
                    </div>
                `
            })
        }

        loadUserInfo().then(loadPlans);
    </script>
</body>
</html>
