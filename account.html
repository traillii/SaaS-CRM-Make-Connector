<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户与收款设置 - Account Settings</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --error: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    .field-hint {
      font-weight: 400;
      color: var(--muted);
      margin-left: 6px;
      font-size: 12px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .actions {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      font-size: 13px;
    }
    .status.ok { color: var(--success); }
    .status.err { color: var(--error); }
  </style>
</head>
<body>
  <div class="container">
    <h1>企业与收款账户信息</h1>
    <p class="subtitle">填写以下信息以同步至 Notion 档案并用于结算与开票。</p>
    <form id="accountForm">
      <div class="form-group">
        <label for="companyLegalName">Company / Legal Name <span class="field-hint">公司法定全称</span></label>
        <input type="text" id="companyLegalName" name="companyLegalName" placeholder="例如：Nordic Tech AB" />
      </div>
      <div class="form-group">
        <label for="vatNumberOrgNr">VAT Number / Org.nr <span class="field-hint">税号 / 组织机构代码</span></label>
        <input type="text" id="vatNumberOrgNr" name="vatNumberOrgNr" placeholder="例如：SE556000000001" />
      </div>
      <div class="form-group">
        <label for="bankName">Bank Name <span class="field-hint">开户银行（Notion Select 对齐）</span></label>
        <select id="bankName" name="bankName">
          <option value="">-- 请选择开户银行 --</option>
          <option value="Wise">Wise</option>
          <option value="Nordea">Nordea</option>
          <option value="Swedbank">Swedbank</option>
          <option value="SEB">SEB</option>
          <option value="Handelsbanken">Handelsbanken</option>
          <option value="Danske Bank">Danske Bank</option>
          <option value="DNB">DNB</option>
          <option value="Revolut">Revolut</option>
          <option value="__CUSTOM__">其他银行（手动输入）</option>
        </select>
      </div>
      <div class="form-group" id="customBankGroup" style="display: none;">
        <label for="customBankName">自定义银行名称 <span class="field-hint">请勿包含英文逗号</span></label>
        <input type="text" id="customBankName" placeholder="输入银行名称，例如：Länsförsäkringar Bank" />
      </div>
      <div class="form-group">
        <label for="ibanBankgiroPlusgiro">IBAN / Bankgiro / Plusgiro <span class="field-hint">收款账号</span></label>
        <input type="text" id="ibanBankgiroPlusgiro" name="ibanBankgiroPlusgiro" placeholder="例如：SE45 5000 0000 0583 9825 7466 或 123-4567" />
      </div>
      <div class="form-group">
        <label for="swiftBic">SWIFT / BIC <span class="field-hint">国际电汇代码</span></label>
        <input type="text" id="swiftBic" name="swiftBic" placeholder="例如：NDEASESS" />
      </div>
      <div class="actions">
        <button type="submit" id="saveBtn">保存设置</button>
        <span id="statusMsg" class="status"></span>
      </div>
    </form>
  </div>
  <script>
    // Worker后端域名，末尾不要斜杠
    const WORKER_B_BASE_URL = window.WORKER_B_BASE_URL || "https://saa-signup.qq596337481.workers.dev";
    const PRESET_BANKS = [
      "Wise",
      "Nordea",
      "Swedbank",
      "SEB",
      "Handelsbanken",
      "Danske Bank",
      "DNB",
      "Revolut"
    ];
    const form = document.getElementById("accountForm");
    const bankSelect = document.getElementById("bankName");
    const customBankGroup = document.getElementById("customBankGroup");
    const customBankInput = document.getElementById("customBankName");
    const saveBtn = document.getElementById("saveBtn");
    const statusMsg = document.getElementById("statusMsg");

    // 从localStorage拿uid（登录成功后写入localStorage.setItem("user_uid",返回的uid)）
    function getUserUid(){
      return localStorage.getItem("user_uid") || "";
    }

    function setStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.className = "status " + (isError ? "err" : "ok");
    }

    bankSelect.addEventListener("change", () => {
      if (bankSelect.value === "__CUSTOM__") {
        customBankGroup.style.display = "block";
        customBankInput.focus();
      } else {
        customBankGroup.style.display = "none";
      }
    });

    async function loadProfile() {
      const uid = getUserUid();
      if (!uid) {
        setStatus("未登录，请返回登录页面",true);
        return;
      }
      try {
        const res = await fetch(WORKER_B_BASE_URL, {
          method:"POST",
          headers:{"Content‑Type":"application/json"},
          body:JSON.stringify({
            uid,
            action:"getAccountProfile"
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          setStatus(data.error||"读取档案失败",true);
          return;
        }
        const p = data.profile || {};
        document.getElementById("companyLegalName").value = p.companyLegalName || "";
        document.getElementById("vatNumberOrgNr").value = p.vatNumberOrgNr || "";
        document.getElementById("ibanBankgiroPlusgiro").value = p.ibanBankgiroPlusgiro || "";
        document.getElementById("swiftBic").value = p.swiftBic || "";
        if (p.bankName) {
          if (PRESET_BANKS.includes(p.bankName)) {
            bankSelect.value = p.bankName;
            customBankGroup.style.display = "none";
          } else {
            bankSelect.value = "__CUSTOM__";
            customBankGroup.style.display = "block";
            customBankInput.value = p.bankName;
          }
        }
      } catch (err) {
        console.error("Failed to load profile:", err);
        setStatus("网络读取失败",true);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const uid = getUserUid();
      if (!uid) {
        setStatus("未登录，请返回登录页面", true);
        return;
      }
      const selectedBank =
        bankSelect.value === "__CUSTOM__"
          ? customBankInput.value.replace(/,/g, " ").trim()
          : bankSelect.value;
      const payload = {
        companyLegalName: document.getElementById("companyLegalName").value.trim(),
        vatNumberOrgNr: document.getElementById("vatNumberOrgNr").value.trim(),
        bankName: selectedBank,
        ibanBankgiroPlusgiro: document.getElementById("ibanBankgiroPlusgiro").value.trim(),
        swiftBic: document.getElementById("swiftBic").value.trim(),
      };
      saveBtn.disabled = true;
      setStatus("正在保存...");
      try {
        const res = await fetch(WORKER_B_BASE_URL, {
          method: "POST",
          headers: { "Content‑Type": "application/json" },
          body: JSON.stringify({
            uid,
            action:"updateAccountProfile",
            payload
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || "保存失败");
        }
        setStatus("已成功同步至 Notion！");
      } catch (err) {
        setStatus(err.message || "保存失败，请稍后重试", true);
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadProfile();
  </script>
</body>
</html>
